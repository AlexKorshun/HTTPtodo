services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s
volumes:
  pgdata:
