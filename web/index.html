<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --border: #e3e6ea;
    --accent: #2f6feb;
    --accent-text: #ffffff;
    --danger: #c2410c;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1c1f24;
      --text: #e8eaed;
      --muted: #9aa2ad;
      --border: #2b2f36;
      --accent: #5b8def;
      --accent-text: #0f1115;
      --danger: #f97316;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 560px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .who { color: var(--muted); font-size: 13px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  form.row { display: flex; gap: 8px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field + .field { margin-top: 14px; }

  input[type=text], input[type=email], input[type=password] {
    width: 100%;
    padding: 10px 12px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
    font-weight: 400;
  }
  button.ghost:hover { color: var(--text); }
  .actions { display: flex; gap: 8px; margin-top: 18px; }

  ul { list-style: none; margin: 18px 0 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 2px;
    border-top: 1px solid var(--border);
  }
  li input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; flex: none; }
  li .text { flex: 1; overflow-wrap: anywhere; }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  li .del {
    flex: none;
    padding: 4px 8px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  li .del:hover { color: var(--danger); }

  .empty, .error { margin-top: 16px; font-size: 14px; }
  .empty { color: var(--muted); }
  .error { color: var(--danger); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Задачи</h1>
    <span class="who">
      <span id="who-email"></span>
      <button id="logout" class="ghost hidden" type="button">Выйти</button>
    </span>
  </header>

  <!-- Экран входа -->
  <section id="auth-screen" class="card hidden">
    <form id="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="4">
      </div>
      <div class="actions">
        <button id="login-btn" type="submit">Войти</button>
        <button id="register-btn" class="ghost" type="button">Зарегистрироваться</button>
      </div>
    </form>
    <p id="auth-error" class="error hidden"></p>
  </section>

  <!-- Экран задач -->
  <section id="tasks-screen" class="card hidden">
    <form id="add-form" class="row">
      <input id="new-task" type="text" placeholder="Новая задача" required>
      <button type="submit">Добавить</button>
    </form>
    <ul id="list"></ul>
    <p id="empty" class="empty hidden">Задач пока нет.</p>
    <p id="tasks-error" class="error hidden"></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = "todo_token";
const EMAIL_KEY = "todo_email";

let token = localStorage.getItem(TOKEN_KEY);

// --- работа с API ---------------------------------------------------------

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
    },
    body: body === undefined ? undefined : JSON.stringify(body),
  });

  if (res.status === 401 && token) {   // токен протух или испорчен
    logout();
    throw new Error("Сессия истекла, войдите заново");
  }
  if (res.status === 204) return null;

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
  return data;
}

// --- экраны ---------------------------------------------------------------

function showAuth() {
  $("auth-screen").classList.remove("hidden");
  $("tasks-screen").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("who-email").textContent = "";
}

async function showTasks() {
  $("auth-screen").classList.add("hidden");
  $("tasks-screen").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  $("who-email").textContent = localStorage.getItem(EMAIL_KEY) || "";
  await loadTasks();
}

function logout() {
  token = null;
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(EMAIL_KEY);
  showAuth();
}

function showError(id, err) {
  const el = $(id);
  el.textContent = err.message;
  el.classList.remove("hidden");
}

function clearError(id) {
  $(id).classList.add("hidden");
}

// --- задачи ---------------------------------------------------------------

function render(tasks) {
  const list = $("list");
  list.replaceChildren();
  $("empty").classList.toggle("hidden", tasks.length > 0);

  for (const task of tasks) {
    const li = document.createElement("li");
    if (task.done) li.classList.add("done");

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = task.done;
    box.title = "Отметить выполненной";
    box.addEventListener("change", () => toggleTask(task.id));

    const text = document.createElement("span");
    text.className = "text";
    text.textContent = task.text;

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "×";
    del.title = "Удалить";
    del.addEventListener("click", () => deleteTask(task.id));

    li.append(box, text, del);
    list.append(li);
  }
}

async function loadTasks() {
  try {
    clearError("tasks-error");
    render(await api("GET", "/tasks") || []);
  } catch (err) {
    showError("tasks-error", err);
  }
}

async function addTask(text) {
  try {
    clearError("tasks-error");
    await api("POST", "/tasks", { text });
    $("new-task").value = "";
    await loadTasks();
  } catch (err) {
    showError("tasks-error", err);
  }
}

async function toggleTask(id) {
  try {
    await api("PATCH", `/tasks/${id}`);
    await loadTasks();
  } catch (err) {
    showError("tasks-error", err);
  }
}

async function deleteTask(id) {
  try {
    await api("DELETE", `/tasks/${id}`);
    await loadTasks();
  } catch (err) {
    showError("tasks-error", err);
  }
}

// --- вход и регистрация ---------------------------------------------------

function credentials() {
  return { email: $("email").value.trim(), password: $("password").value };
}

async function login() {
  const creds = credentials();
  const data = await api("POST", "/auth/login", creds);
  token = data.token;
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(EMAIL_KEY, creds.email);
  await showTasks();
}

$("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError("auth-error");
  try {
    await login();
  } catch (err) {
    showError("auth-error", err);
  }
});

$("register-btn").addEventListener("click", async () => {
  clearError("auth-error");
  if (!$("auth-form").reportValidity()) return;
  try {
    await api("POST", "/auth/register", credentials());
    await login();   // сразу входим под только что созданным пользователем
  } catch (err) {
    showError("auth-error", err);
  }
});

$("add-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("new-task").value.trim();
  if (text) addTask(text);
});

$("logout").addEventListener("click", logout);

// --- старт ----------------------------------------------------------------

if (token) showTasks(); else showAuth();
</script>
</body>
</html>
